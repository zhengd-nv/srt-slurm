# Qwen3.5-397B-A17B-FP8 2P1D: Prefill TP4/EP4 (2 nodes) + Decode DeepEP TP8/EP8 (2 nodes)
# Total 4 nodes: prefill simple, decode wide-EP with low_latency
# Performance is un-verified. Accuracy testing in progress.
# Purpose: accuracy verification (not for pareto benchmarking)

name: "qwen3.5-deepep-2p1d-dep4-dep8"

model:
  path: "qwen3.5-fp8"
  container: "dev"  # docker://lmsysorg/sglang:dev
  precision: "fp8"

extra_mount:
  - "/lustre/fsw/portfolios/coreai/users/zhengd/DeepEP:/sgl-workspace/DeepEP"
  # - "/lustre/fsw/portfolios/coreai/users/zhengd/sglang:/sgl-workspace/sglang"

setup_script: "rebuild-deepep.sh"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  # Prefill: 2 nodes TP4/EP4, Decode: 2 nodes TP8/EP8
  prefill_nodes: 2
  decode_nodes: 2
  prefill_workers: 2
  decode_workers: 1

frontend:
  type: "sglang"
  enable_multiple_frontends: false

backend:

  prefill_environment:
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "1800"
    PYTHONUNBUFFERED: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    MC_FORCE_MNNVL: "1"
    SGLANG_DG_CACHE_DIR: "/configs/deepgemm-cache"
    FLASHINFER_WORKSPACE_BASE: "/configs/flashinfer-cache"
    SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
    SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: "0"
    SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"

  decode_environment:
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "1800"
    PYTHONUNBUFFERED: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    MC_FORCE_MNNVL: "1"
    MC_TE_METRIC: "true"
    SGLANG_DG_CACHE_DIR: "/configs/deepgemm-cache"
    FLASHINFER_WORKSPACE_BASE: "/configs/flashinfer-cache"
    SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    SGLANG_DECODE_BOOTSTRAP_TIMEOUT: "1000"
    SGLANG_HACK_SEQ_BOOTSTRAP_ROOM: "1"
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
    SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: "0"
    SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"
    SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "1024"

  sglang_config:
    prefill:
      served-model-name: "Qwen/Qwen3.5-397B-A17B-FP8"
      model-path: "/model/"

      attention-backend: "trtllm_mha"
      quantization: "fp8"
      kv-cache-dtype: "fp8_e4m3"
      moe-runner-backend: "flashinfer_trtllm"

      # DEP4: DP4 + TP4 + EP4 with dp-attention
      tensor-parallel-size: 4
      data-parallel-size: 4
      expert-parallel-size: 4
      enable-dp-attention: true
      enable-dp-lm-head: true
      moe-dense-tp-size: 1

      # Mamba hybrid model settings
      mamba-scheduler-strategy: "no_buffer"
      mamba-track-interval: 2048
      mamba-ssm-dtype: "bfloat16"

      # PD disaggregation
      disaggregation-mode: "prefill"
      disable-radix-cache: true
      disaggregation-bootstrap-port: 31000

      # Memory: same as AGG/1p1d configs
      mem-fraction-static: 0.80
      chunked-prefill-size: 131072

      load-balance-method: "round_robin"
      watchdog-timeout: 1000000
      disable-cuda-graph: true

    decode:
      served-model-name: "Qwen/Qwen3.5-397B-A17B-FP8"
      model-path: "/model/"

      attention-backend: "trtllm_mha"
      quantization: "fp8"
      kv-cache-dtype: "fp8_e4m3"
      moe-runner-backend: "deep_gemm"

      # Parallelism: TP8/EP8 across 2 GB200 nodes
      tensor-parallel-size: 8
      data-parallel-size: 8
      expert-parallel-size: 8
      enable-dp-attention: true
      enable-dp-lm-head: true
      moe-dense-tp-size: 1

      # Mamba hybrid model settings
      mamba-scheduler-strategy: "no_buffer"
      mamba-track-interval: 2048
      mamba-ssm-dtype: "bfloat16"

      # PD disaggregation
      disaggregation-mode: "decode"
      disable-radix-cache: true
      disaggregation-bootstrap-port: 31000

      mem-fraction-static: 0.80
      chunked-prefill-size: 131072
      context-length: 10000
      cuda-graph-max-bs: 256
      max-running-requests: 2048
      watchdog-timeout: 1000000

      # DeepEP: low_latency for decode (requires rebuilt DeepEP with kNumMaxTopK=16)
      moe-a2a-backend: "deepep"
      deepep-mode: "low_latency"
      ep-dispatch-algorithm: "static"
      prefill-round-robin-balance: true

      # Workload balance
      eplb-algorithm: "deepseek"

      decode-log-interval: 1
      stream-interval: 50

# profiling:
#   type: "nsys"
#   prefill:
#     start_step: 10
#     stop_step: 50
#   decode:
#     start_step: 1000
#     stop_step: 1050
#   nsys_args: ["--backtrace=none", "--sample=none", "--cpuctxsw=none", "--cuda-event-trace=false"]

benchmark:
  type: "sa-bench"
  isl: 1024
  osl: 1024
  concurrencies: "8x16x32x64x128x256x512x1024x2048"
  req_rate: inf
  random_range_ratio: 1.0
  num_warmup_mult: 1
  num_prompts_mult: 5
